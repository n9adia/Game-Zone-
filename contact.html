<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا | GAME ZONE</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="شعار GAME ZONE">
      </a>
      <ul>
        <li><a href="index.html" >الرئيسية</a></li>
        <li><a href="page1.html" >الألعاب</a></li>
        <li><a href="page2.html" >من نحن</a></li>
        <li><a href="contact.html" class="active">اتصل بنا</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-title">
      <h1>اتصل بنا</h1>
      <p>عندك سؤال أو اقتراح؟ اكتب لنا.</p>
    </section>

    <section>
      <form action="contact.html" method="get">
        <label for="name">الاسم</label>
        <input type="text" id="name" name="name" placeholder="اكتب اسمك" required>

        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required>

        <label for="message">الرسالة</label>
        <textarea id="message" name="message" placeholder="اكتب رسالتك هنا" required></textarea>

        <button type="submit" class="btn">إرسال</button>
      </form>
    </section>
  </main>

  <footer>
    <p>GAME ZONE &copy; 2026 - عالم الألعاب الإلكترونية</p>
  </footer>
</body>
</html>
